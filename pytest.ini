[pytest]
testpaths = tests
pythonpath = .
markers =
    api: API tests
    mock: Mocked tests (no network)
    live: Live integration tests (network)
addopts = --html=report.html --self-contained-html
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_file = logs/pytest.log
log_file_level = INFO